name: Run test suite

###########################################################
# Start the job on pushes to main and all pull requests #
###########################################################
on:
  push:
    branches: main
    paths-ignore:
      - 'changelog.d/*'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'changelog.d/*'
      - 'README.md'
  schedule: # Run daily at 08:00 CEST (06:00 UST)
    - cron: '0 6 * * *'

permissions:
  actions: write
  contents: read

###############
# Set the Job #
###############
jobs:
  tests:
    # Name the Job
    name: "Test on Python ${{ matrix.python-version}}"
    # Set the agent to run on
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone for improved SonarCloud analysis
          persist-credentials: false


      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        run: |
          uv pip install --system "tox>=4" tox-gh-actions tox-uv coverage
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends snmp libsnmp-dev

      - name: Test with tox
        run: tox

      - name: Upload test reports (${{ matrix.python-version }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.python-version }}
          path: |
            reports/**/*

      - name: Upload coverage reports to Codecov
        if: github.repository_owner == 'Uninett'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
