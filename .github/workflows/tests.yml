name: Run test suite

###########################################################
# Start the job on pushes to main and all pull requests #
###########################################################
on:
  push:
    branches: main
    paths-ignore:
      - 'changelog.d/*'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'changelog.d/*'
      - 'README.md'
  schedule: # Run daily at 08:00 CEST (06:00 UST)
    - cron: '0 6 * * *'

###############
# Set the Job #
###############
jobs:
  tests:
    # Name the Job
    name: "Test on Python ${{ matrix.python-version}}"
    # Set the agent to run on
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 5
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Disable shallow clone for improved SonarCloud analysis


      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d 

      - name: Install dependencies
        run: |
          uv pip install --system "tox>=4" tox-gh-actions tox-uv coverage
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends snmp libsnmp-dev

      - name: Test with tox
        run: tox

      - name: Upload test reports (${{ matrix.python-version }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.python-version }}
          path: |
            reports/**/*

      - name: Upload coverage reports to Codecov
        if: github.repository_owner == 'Uninett'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
